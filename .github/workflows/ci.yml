name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat all warnings as errors — no silent issues
  RUSTFLAGS: "-D warnings"

jobs:
  installer-posix:
    name: Installer / POSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test macOS and Linux installer contract
        run: bash scripts/test-install.sh

  installer-windows:
    name: Installer / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/openai_sdk/requirements.txt

      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-windows

      - name: Test Gateway on Windows
        run: cargo test --locked --lib --bins --tests

      - name: Build native Windows fixture
        run: cargo build --locked --bin a3s-gateway

      - name: Install official OpenAI SDK
        run: python -m pip install --requirement tests/openai_sdk/requirements.txt

      - name: Run official SDK conformance on Windows
        run: python tests/openai_sdk/test_conformance.py

      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1 -Binary target/debug/a3s-gateway.exe

      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1 -Binary target/debug/a3s-gateway.exe

      - name: Build Windows ARM64 release target
        run: cargo build --locked --target aarch64-pc-windows-msvc --bin a3s-gateway

  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: bash scripts/run-cargo-annotated.sh cargo clippy --locked --lib --bins --examples --tests -- -D warnings

      - name: Clippy (all features)
        run: bash scripts/run-cargo-annotated.sh cargo clippy --locked --all-features --lib --bins --examples --tests -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --locked --lib --bins

      - name: Build (all features)
        run: cargo build --locked --all-features --lib --bins

      - name: Test (default features)
        run: |
          set -euo pipefail
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT
          set +e
          cargo test --locked --lib --bins --examples --tests 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -ne 0 ]; then
            failure_summary=$(awk '/^failures:$/ { capture = 1 } capture { print }' "$output_file" | tail -n 40)
            if [ -z "$failure_summary" ]; then
              failure_summary=$(tail -n 40 "$output_file")
            fi
            failure_summary=${failure_summary//'%'/'%25'}
            failure_summary=${failure_summary//$'\r'/'%0D'}
            failure_summary=${failure_summary//$'\n'/'%0A'}
            echo "::error title=Default feature test failure::$failure_summary"
            exit "$test_status"
          fi

          # Refuse silent zero-test passes
          if ! grep -q "test result: ok" "$output_file"; then
            echo "::error::No 'test result: ok' found. Tests may not have run."
            exit 1
          fi

          # Verify tests actually executed (not all 0)
          total_passed=$(grep -oE '[0-9]+ passed' "$output_file" | awk '{s+=$1} END {print s+0}')
          if [ "$total_passed" -eq 0 ]; then
            echo "::error::Zero tests passed. Refusing silent success."
            exit 1
          fi

          echo "Default feature tests passed ($total_passed tests)."

      - name: Test (all features)
        run: |
          set -euo pipefail
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT
          set +e
          cargo test --locked --all-features --lib --bins --examples --tests 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -ne 0 ]; then
            failure_summary=$(awk '/^failures:$/ { capture = 1 } capture { print }' "$output_file" | tail -n 40)
            if [ -z "$failure_summary" ]; then
              failure_summary=$(tail -n 40 "$output_file")
            fi
            failure_summary=${failure_summary//'%'/'%25'}
            failure_summary=${failure_summary//$'\r'/'%0D'}
            failure_summary=${failure_summary//$'\n'/'%0A'}
            echo "::error title=All-feature test failure::$failure_summary"
            exit "$test_status"
          fi

          if ! grep -q "test result: ok" "$output_file"; then
            echo "::error::No 'test result: ok' found. Tests may not have run."
            exit 1
          fi

          total_passed=$(grep -oE '[0-9]+ passed' "$output_file" | awk '{s+=$1} END {print s+0}')
          if [ "$total_passed" -eq 0 ]; then
            echo "::error::Zero tests passed. Refusing silent success."
            exit 1
          fi

          echo "All-features tests passed ($total_passed tests)."

  kubernetes-scale-conformance:
    name: Kubernetes Scale / Real Cluster
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: kubernetes-scale-conformance

      - name: Install checksum-verified kind
        env:
          KIND_VERSION: v0.32.0
          KIND_LINUX_AMD64_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' "$KIND_LINUX_AMD64_SHA256" "$RUNNER_TEMP/kind" \
            | sha256sum --check --strict -
          chmod 0755 "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Create pinned Kubernetes cluster
        env:
          KIND_NODE_IMAGE: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
        run: |
          kind create cluster \
            --name a3s-gateway-scale \
            --image "$KIND_NODE_IMAGE" \
            --wait 120s

      - name: Prove Scale CAS and controller recovery
        env:
          A3S_GATEWAY_TEST_KUBERNETES: "1"
        run: |
          cargo test --locked --features kube --lib \
            scaling::kubernetes_conformance_tests::real_cluster_enforces_scale_cas_and_recovers_controller_state \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Delete Kubernetes cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name a3s-gateway-scale
          fi

  box-sandbox-conformance:
    name: Box Scale / Real Linux Sandbox
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 60
    env:
      A3S_DEPS_STUB: "1"
      A3S_BOX_REV: 6291d79ea79b5901a31783de890dcc28781c0000
      A3S_OCI_RUNTIME_REV: 9c3be8e126dda7ff7add5e6e88c427f68c7d6629
      A3S_HOME: /tmp/a3s-gateway-box-sandbox-conformance
      A3S_BOX_OCI_RUNTIME_PATH: /tmp/a3s-gateway-box-sandbox-conformance/bin/a3s-oci
      A3S_BOX_OCI_AGENT_PATH: /tmp/a3s-gateway-box-sandbox-conformance/bin/a3s-oci-agent
      A3S_BOX_OCI_HOST_ROOT: /tmp/a3s-gateway-box-sandbox-oci-host
      A3S_GATEWAY_BOX_SANDBOX_IMAGE: docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned A3S Box
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Box
          ref: ${{ env.A3S_BOX_REV }}
          path: box

      - name: Initialize Box submodules
        working-directory: box
        run: git -c http.extraheader= submodule update --init --recursive

      - name: Checkout pinned A3S OCI Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/OCI-Runtime
          ref: ${{ env.A3S_OCI_RUNTIME_REV }}
          path: oci-runtime

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies and stub libkrun
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools protobuf-compiler
          sed -nE \
            's/^[[:space:]]*pub fn (krun_[A-Za-z0-9_]+).*/long \1(void) { return -1; }/p' \
            box/src/deps/libkrun-sys/src/lib.rs \
            | sort -u > "$RUNNER_TEMP/krun_stub.c"
          test -s "$RUNNER_TEMP/krun_stub.c"
          gcc -shared -o "$RUNNER_TEMP/libkrun.so" "$RUNNER_TEMP/krun_stub.c"
          sudo install -m 755 "$RUNNER_TEMP/libkrun.so" /usr/lib/libkrun.so
          sudo ldconfig

      - uses: Swatinem/rust-cache@v2
        with:
          key: box-sandbox-conformance
          workspaces: |
            .
            box/src
            oci-runtime

      - name: Build exact Gateway, Box, and OCI Runtime revisions
        run: |
          set -euo pipefail
          cargo test --locked --test box_sandbox_conformance --no-run
          (
            export RUSTFLAGS=""
            cd box/src
            cargo build --locked -p a3s-box-cli -p a3s-box-shim
            cargo build --locked --release -p a3s-box-guest-init \
              --target x86_64-unknown-linux-musl
          )
          (
            export RUSTFLAGS=""
            cd oci-runtime
            cargo build --locked --release -p a3s-oci-cli -p a3s-oci-agent
          )

      - name: Install real Sandbox runtime artifacts
        run: |
          set -euo pipefail
          sudo install -d -m 755 "$A3S_HOME/bin"
          sudo install -m 755 box/src/target/debug/a3s-box-shim \
            "$A3S_HOME/bin/a3s-box-shim"
          sudo install -m 755 \
            box/src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_HOME/bin/a3s-box-guest-init"
          sudo install -m 755 oci-runtime/target/release/a3s-oci \
            "$A3S_BOX_OCI_RUNTIME_PATH"
          sudo install -m 755 oci-runtime/target/release/a3s-oci-agent \
            "$A3S_BOX_OCI_AGENT_PATH"
          test -x box/src/target/debug/a3s-box
          test -x "$A3S_HOME/bin/a3s-box-shim"
          test -x "$A3S_HOME/bin/a3s-box-guest-init"
          test -x "$A3S_BOX_OCI_RUNTIME_PATH"
          test -x "$A3S_BOX_OCI_AGENT_PATH"
          grep -q '^root:' /etc/subuid ||
            echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid ||
            echo 'root:100000:65536' | sudo tee -a /etc/subgid

      - name: Mount private Runtime Secret tmpfs
        run: |
          sudo install -d -m 700 "$A3S_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,mode=0700,nosuid,nodev,noexec \
            a3s-gateway-runtime-secrets "$A3S_HOME/runtime-secrets"
          mountpoint -q "$A3S_HOME/runtime-secrets"

      - name: Cache the digest-pinned Sandbox image
        run: |
          sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              A3S_DEPS_STUB=1 \
              A3S_HOME="$A3S_HOME" \
              "$GITHUB_WORKSPACE/box/src/target/debug/a3s-box" pull \
                "$A3S_GATEWAY_BOX_SANDBOX_IMAGE"

      - name: Prove Box-to-Gateway Sandbox endpoint relay
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/a3s-gateway-box-sandbox-conformance.log"
          set +e
          sudo env \
              PATH="$PATH" \
              HOME="$HOME" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
              CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              RUSTFLAGS="$RUSTFLAGS" \
              A3S_DEPS_STUB=1 \
              A3S_HOME="$A3S_HOME" \
              A3S_BOX_OCI_MIGRATION=sandbox \
              A3S_BOX_OCI_HOST_ROOT="$A3S_BOX_OCI_HOST_ROOT" \
              A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
              A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
              A3S_GATEWAY_TEST_BOX_SANDBOX=1 \
              A3S_GATEWAY_BOX_BINARY="$GITHUB_WORKSPACE/box/src/target/debug/a3s-box" \
              A3S_GATEWAY_BOX_SANDBOX_IMAGE="$A3S_GATEWAY_BOX_SANDBOX_IMAGE" \
              RUST_MIN_STACK=16777216 \
              cargo test --locked --test box_sandbox_conformance \
                real_box_sandbox_endpoint_relay_scales_from_zero_and_retires \
                -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r owner_log; do
              {
                echo
                echo "===== $owner_log ====="
                sudo tail -c 3800 "$owner_log"
              } | tee -a "$log"
            done < <(sudo find "$A3S_BOX_OCI_HOST_ROOT" -maxdepth 1 -type f -name 'owner.*.log' -print 2>/dev/null)
            while IFS= read -r worker_log; do
              {
                echo
                echo "===== $worker_log ====="
                sudo tail -c 3800 "$worker_log"
              } | tee -a "$log"
            done < <(sudo find "$A3S_HOME" -type f -path '*/oci-log-projection/worker.log' -print 2>/dev/null)
            first_failure="$(grep -m 1 -B 8 -A 20 -E \
              'Scale workload reconciliation failed|A3S OCI (create|start) rejected' \
              "$log" || true)"
            diagnostic="$(printf '%s\n\n===== final log tail =====\n%s' \
              "$first_failure" "$(tail -c 3800 "$log")")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Real Box Sandbox relay failure::$diagnostic"
          fi
          exit "$status"

      - name: Unmount Runtime Secret tmpfs
        if: always()
        run: |
          if mountpoint -q "$A3S_HOME/runtime-secrets"; then
            sudo umount "$A3S_HOME/runtime-secrets" || true
          fi

  openai-sdk-conformance:
    name: OpenAI SDK Conformance
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/openai_sdk/requirements.txt

      - uses: Swatinem/rust-cache@v2

      - name: Install official OpenAI SDK
        run: python -m pip install --requirement tests/openai_sdk/requirements.txt

      - name: Build Gateway
        run: cargo build --locked --bin a3s-gateway

      - name: Run official SDK conformance
        run: python tests/openai_sdk/test_conformance.py

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --all-features

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV (1.88)
        run: bash scripts/run-cargo-annotated.sh cargo check --locked --all-features

  bench-check:
    name: Benchmark Compile
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks (no run)
        run: cargo bench --locked --no-run --all-features

  doc-check:
    name: Documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build docs (fail on warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --all-features --no-deps
