name: Performance Baseline

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "examples/protocol_benchmark_*.rs"
      - "benchmarks/proxy-comparison/**"
      - "scripts/export-criterion.py"
      - "scripts/export-proxy-comparison.py"
      - "scripts/test-export-proxy-comparison.py"
      - "scripts/run-proxy-comparison.sh"
      - ".github/workflows/benchmarks.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  benchmark:
    name: Criterion baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: performance-baseline

      - name: Install same-host proxy benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx libnginx-mod-stream openssl
          curl --fail --location --retry 3 \
            --output /tmp/oha \
            https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64
          echo "86ab7fa2c1df23b3bbc53b73561ffa44a7a38ca08f0e10351df9522a5c4c3c61  /tmp/oha" \
            | sha256sum --check -
          sudo install --mode 0755 /tmp/oha /usr/local/bin/oha
          oha --version

      - name: Build the shipped Gateway release profile
        run: |
          bash scripts/run-cargo-annotated.sh cargo build --locked --release \
            --bin a3s-gateway \
            --example protocol_benchmark_upstream \
            --example protocol_benchmark_load

      - name: Test comparison exporter
        run: python3 scripts/test-export-proxy-comparison.py

      - name: Compare all Gateway traffic types with NGINX
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cpu_model=$(lscpu | awk -F: '/Model name/ {sub(/^[ \t]+/, "", $2); print $2; exit}')
          memory_mib=$(awk '/MemTotal/ {printf "%d", $2 / 1024}' /proc/meminfo)
          export GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export RUNNER_IMAGE="${ImageOS:-ubuntu}-${ImageVersion:-24.04}"
          export CPU_MODEL="$cpu_model"
          export LOGICAL_CPUS=$(nproc)
          export MEMORY_MIB="$memory_mib"
          export KERNEL_VERSION=$(uname -srmo)
          bash scripts/run-proxy-comparison.sh
          python3 -m json.tool website/assets/performance-comparison.json >/dev/null
          python3 website/scripts/check_site.py
          echo '## Same-host multi-protocol comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '| Traffic | A3S ops/s | NGINX ops/s | A3S/NGINX | P99 ratio | Alignment |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: | ---: | ---: | --- |' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          data = json.load(open("website/assets/performance-comparison.json"))
          for profile in data["profiles"].values():
              a3s = profile["proxies"]["a3s-gateway"]["median"]
              nginx = profile["proxies"]["nginx"]["median"]
              ratios = profile["comparison"]
              print(
                  f'| {profile["label"]} '
                  f'| {a3s["operations_per_second"]:,.0f} '
                  f'| {nginx["operations_per_second"]:,.0f} '
                  f'| {ratios["a3s_to_nginx_throughput_ratio"]:.3f}× '
                  f'| {ratios["a3s_to_nginx_p99_latency_ratio"]:.3f}× '
                  f'| {profile["capability_alignment"]} |'
              )
          PY

      - name: Upload protocol benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-comparison-${{ github.run_id }}
          path: |
            target/proxy-comparison/*.json
            target/proxy-comparison/*.log
            website/assets/performance-comparison.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run routing benchmark
        run: bash scripts/run-cargo-annotated.sh cargo bench --locked --bench routing

      - name: Run middleware benchmark
        run: cargo bench --locked --bench middleware_pipeline

      - name: Run ACL parsing benchmark
        run: cargo bench --locked --bench acl_parse

      - name: Export benchmark data
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cpu_model=$(lscpu | awk -F: '/Model name/ {sub(/^[ \t]+/, "", $2); print $2; exit}')
          memory_mib=$(awk '/MemTotal/ {printf "%d", $2 / 1024}' /proc/meminfo)
          runner_image="${ImageOS:-ubuntu}-${ImageVersion:-24.04}"
          kernel=$(uname -srmo)
          rustc_version=$(rustc --version --verbose | tr '\n' ' ')
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/export-criterion.py \
            --criterion-root target/criterion \
            --output website/assets/performance-data.json \
            --markdown-output benchmark-summary.md \
            --commit "$GITHUB_SHA" \
            --run-url "$RUN_URL" \
            --generated-at "$generated_at" \
            --runner-image "$runner_image" \
            --cpu-model "$cpu_model" \
            --logical-cpus "$(nproc)" \
            --memory-mib "$memory_mib" \
            --kernel "$kernel" \
            --rustc "$rustc_version"
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 -m json.tool website/assets/performance-data.json >/dev/null
          python3 website/scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website artifact
        run: |
          mkdir _site
          cp -R website/. _site/
          cp install.sh install.ps1 _site/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy benchmark data
        id: deployment
        uses: actions/deploy-pages@v4
