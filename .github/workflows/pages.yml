name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate static files
        run: python3 website/scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check website/traffic-profiles.js
          node --check website/app.js
          node --check website/docs/docs.js

  deploy:
    name: Deploy website
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website artifact
        run: |
          mkdir _site
          cp -R website/. _site/
          cp install.sh install.ps1 _site/
      - name: Preserve published benchmark datasets
        env:
          PUBLISHED_SITE_URL: https://a3s-lab.github.io/Gateway
        run: |
          for asset in performance-comparison.json performance-data.json ai-gateway-comparison.json; do
            published=$(mktemp)
            if curl --fail --location --retry 3 \
              --header 'Cache-Control: no-cache' \
              "${PUBLISHED_SITE_URL}/assets/${asset}?run=${GITHUB_RUN_ID}" \
              --output "$published"; then
              python3 -m json.tool "$published" >/dev/null
              mv "$published" "_site/assets/${asset}"
              echo "Preserved published assets/${asset}"
            else
              rm -f "$published"
              echo "::notice::No published ${asset} was available; using the checked-in fallback"
            fi
          done
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
