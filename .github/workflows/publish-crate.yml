name: Publish Gateway crate dependency

on:
  push:
    tags:
      - "publish/gateway-crate/v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish the tested Gateway crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify published source identity and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          operation_tag="${GITHUB_REF#refs/tags/}"
          prefix='publish/gateway-crate/v'
          if [[ "$operation_tag" != "$prefix"* ]]; then
            echo "unexpected operation tag: $operation_tag" >&2
            exit 1
          fi
          operation_version="${operation_tag#${prefix}}"
          if [[ ! "$operation_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-recovery\.[1-9][0-9]*)?$ ]]; then
            echo "invalid operation version: $operation_version" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "crate source $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "a3s-gateway") | .version')"
          if [ "$manifest_version" != "$version" ]; then
            echo "operation tag requests $version but source contains $manifest_version" >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "crate source checkout is dirty" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify source formatting
        run: cargo fmt --all -- --check

      - name: Verify managed-service compatibility
        run: cargo test --locked --lib managed_service

      - name: Verify publishable package
        run: cargo publish --locked --dry-run

      - name: Publish crate idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          user_agent="A3S-Lab-Gateway-crate-publisher/$VERSION (https://github.com/A3S-Lab/Gateway)"
          crate_status() {
            curl --retry 5 --retry-all-errors --silent --show-error \
              --location --user-agent "$user_agent" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/a3s-gateway/$VERSION"
          }
          status="$(crate_status)"
          case "$status" in
            200)
              echo "a3s-gateway@$VERSION already exists; skipping upload"
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "::error::crates.io returned HTTP $status for a3s-gateway@$VERSION"
              exit 1
              ;;
          esac
          for attempt in $(seq 1 24); do
            status="$(crate_status)"
            if [ "$status" = "200" ] && cargo info "a3s-gateway@$VERSION" \
              --registry crates-io >/dev/null 2>&1; then
              echo "Verified a3s-gateway@$VERSION in crates.io and its index"
              exit 0
            fi
            if [ "$status" != "200" ] && [ "$status" != "404" ]; then
              echo "::error::crates.io returned HTTP $status for a3s-gateway@$VERSION"
              exit 1
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 10
            fi
          done
          echo "::error::a3s-gateway@$VERSION did not become visible in time"
          exit 1
