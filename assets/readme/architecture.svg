<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway desired-state and local traffic boundaries</title>
  <desc id="desc">Standalone ACL or A3S Cloud supplies complete desired state. Gateway validates it, activates one immutable snapshot, and handles policy and streaming locally before selecting healthy model backends.</desc>

  <rect x="1" y="1" width="1198" height="558" rx="26" fill="#f8fbff" stroke="#d5e1f0" stroke-width="2"/>
  <text x="56" y="62" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="740" letter-spacing="-1.2">Desired state changes. Token traffic stays local.</text>
  <text x="56" y="96" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">One validated snapshot serves each request without a synchronous control-plane hop.</text>
  <rect x="958" y="38" width="186" height="48" rx="10" fill="#eaf8f3"/>
  <circle cx="984" cy="62" r="6" fill="#0c8a65"/>
  <text x="1002" y="69" fill="#0c6f52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="760">H0.2 VERIFIED</text>

  <g id="desired-state" transform="translate(56 142)">
    <text x="0" y="0" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="740">DESIRED STATE</text>
    <rect x="0" y="22" width="246" height="118" rx="16" fill="#ffffff" stroke="#c7d6e9"/>
    <text x="24" y="62" fill="#1264ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="720">Standalone ACL</text>
    <text x="24" y="94" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">local operator owns policy</text>
    <text x="24" y="120" fill="#7d899b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">file · discovery · providers</text>

    <text x="0" y="184" fill="#7d899b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">OR</text>

    <rect x="0" y="206" width="246" height="118" rx="16" fill="#ffffff" stroke="#a9cfbf"/>
    <text x="24" y="246" fill="#0c8a65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="720">A3S Cloud</text>
    <text x="24" y="278" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">exact revision + digest</text>
    <text x="24" y="304" fill="#7d899b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">certificate · target generation</text>
  </g>

  <path d="M326 304h64" stroke="#1264ff" stroke-width="2"/>
  <path d="M380 295l12 9-12 9" fill="none" stroke="#1264ff" stroke-width="2"/>

  <g id="gateway" transform="translate(404 142)">
    <text x="0" y="0" fill="#1264ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="740">A3S GATEWAY</text>
    <rect x="0" y="22" width="424" height="324" rx="18" fill="#ffffff" stroke="#9ebceb" stroke-width="1.5"/>
    <text x="28" y="68" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="730">Validate → compile → activate</text>
    <text x="28" y="100" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">rejection keeps the prior runtime active</text>

    <rect x="28" y="128" width="368" height="66" rx="12" fill="#eef4ff"/>
    <text x="50" y="157" fill="#1264ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="740">ACTIVE IMMUTABLE SNAPSHOT</text>
    <text x="50" y="181" fill="#34445c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">rev 42 · sha256:7c91… · ready</text>

    <path d="M28 224h368" stroke="#dce4f0"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
      <text x="28" y="266" fill="#56657b">ROUTE</text>
      <path d="M94 260h34" stroke="#9eb5d4" stroke-width="2"/>
      <text x="144" y="266" fill="#56657b">POLICY</text>
      <path d="M220 260h34" stroke="#9eb5d4" stroke-width="2"/>
      <text x="270" y="266" fill="#0c8a65">STREAM</text>
    </g>
    <text x="28" y="308" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">TTFT / idle / total bounds · backpressure</text>
    <text x="28" y="334" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">health · circuit · fallback before response</text>
  </g>

  <path d="M842 304h64" stroke="#0c8a65" stroke-width="2"/>
  <path d="M896 295l12 9-12 9" fill="none" stroke="#0c8a65" stroke-width="2"/>

  <g id="backends" transform="translate(922 142)">
    <text x="0" y="0" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="740">MODEL BACKENDS</text>
    <rect x="0" y="22" width="222" height="96" rx="15" fill="#ffffff" stroke="#a9cfbf"/>
    <circle cx="26" cy="48" r="7" fill="#0c8a65"/>
    <text x="46" y="55" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">Provider A</text>
    <text x="24" y="91" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">healthy · selected</text>

    <rect x="0" y="136" width="222" height="96" rx="15" fill="#ffffff" stroke="#a9cfbf"/>
    <circle cx="26" cy="162" r="7" fill="#0c8a65"/>
    <text x="46" y="169" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">Provider B</text>
    <text x="24" y="205" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">healthy · fallback</text>

    <rect x="0" y="250" width="222" height="96" rx="15" fill="#fffafb" stroke="#e2bdc5"/>
    <circle cx="26" cy="276" r="7" fill="#b73d50"/>
    <text x="46" y="283" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">Provider C</text>
    <text x="24" y="319" fill="#9b5361" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">circuit open · excluded</text>
  </g>

  <text x="56" y="526" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">Gateway: protocol fidelity + local enforcement</text>
  <text x="600" y="526" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">Cloud: operations + rollout + placement + long-term ledger</text>
</svg>
