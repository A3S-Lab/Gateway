<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway control and data plane boundaries</title>
  <desc id="desc">A3S Cloud owns human-facing operations and desired state. Gateway accepts a complete snapshot through its machine-only Node API, validates it, swaps it atomically, and serves traffic locally without a synchronous Cloud call.</desc>

  <rect width="1200" height="600" rx="24" fill="#07090d"/>
  <text x="56" y="64" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="720">Control in Cloud. Traffic in Gateway.</text>
  <text x="1144" y="62" text-anchor="end" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ONE DESIRED STATE / ONE ACTIVE SNAPSHOT</text>

  <g id="desired-state">
    <text x="56" y="116" fill="#54dda1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">DESIRED STATE</text>
    <rect x="56" y="136" width="288" height="122" rx="14" fill="#0d1118" stroke="#313a47"/>
    <text x="82" y="176" fill="#84b4ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650">Standalone ACL</text>
    <text x="82" y="214" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">operator-owned local policy</text>
    <text x="82" y="240" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">file / discovery / providers</text>

    <rect x="856" y="136" width="288" height="122" rx="14" fill="#0d1118" stroke="#2c8f67"/>
    <text x="882" y="176" fill="#72e2b0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650">A3S Cloud</text>
    <text x="882" y="214" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">tenants · rollout · placement</text>
    <text x="882" y="240" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">human operations + usage ledger</text>

    <path d="M358 198H430" stroke="#5794ff" stroke-width="2"/>
    <path d="M422 190L432 198 422 206" fill="none" stroke="#5794ff" stroke-width="2"/>
    <path d="M842 198H770" stroke="#54dda1" stroke-width="2"/>
    <path d="M778 190L768 198 778 206" fill="none" stroke="#54dda1" stroke-width="2"/>
  </g>

  <g id="gateway-boundary">
    <rect x="432" y="114" width="336" height="166" rx="16" fill="#101620" stroke="#5794ff" stroke-width="1.5"/>
    <text x="458" y="150" fill="#84b4ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">GATEWAY BOUNDARY</text>
    <text x="458" y="184" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Validate + compile</text>
    <text x="458" y="218" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">complete policy → atomic swap</text>
    <rect x="458" y="236" width="284" height="26" rx="6" fill="#172130"/>
    <text x="600" y="254" text-anchor="middle" fill="#54dda1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">prior snapshot survives rejection</text>
  </g>

  <g id="machine-api">
    <path d="M1000 258V302H802" fill="none" stroke="#54dda1" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="802" y="286" width="258" height="34" rx="17" fill="#102019" stroke="#2c8f67"/>
    <text x="931" y="308" text-anchor="middle" fill="#72e2b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">machine-only Node API</text>
  </g>

  <g id="data-plane">
    <text x="56" y="350" fill="#5794ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">LOCAL REQUEST PATH</text>
    <rect x="56" y="372" width="1088" height="158" rx="16" fill="#0d1118" stroke="#313a47"/>

    <rect x="80" y="398" width="166" height="106" rx="12" fill="#111722" stroke="#344052"/>
    <text x="104" y="434" fill="#84b4ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650">Clients</text>
    <text x="104" y="468" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HTTP · SSE · WS</text>
    <text x="104" y="492" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">gRPC · TCP · UDP</text>

    <path d="M258 451H296" stroke="#5794ff" stroke-width="2"/>
    <path d="M288 443L298 451 288 459" fill="none" stroke="#5794ff" stroke-width="2"/>

    <rect x="310" y="398" width="580" height="106" rx="12" fill="#101620" stroke="#5794ff" stroke-width="1.5"/>
    <text x="334" y="432" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Active immutable snapshot</text>
    <text x="334" y="468" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">entrypoint → route → middleware → service → healthy target</text>
    <text x="334" y="493" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">streaming backpressure · timeout bounds · pre-response fallback</text>

    <path d="M902 451H940" stroke="#5794ff" stroke-width="2"/>
    <path d="M932 443L942 451 932 459" fill="none" stroke="#5794ff" stroke-width="2"/>

    <rect x="954" y="398" width="166" height="106" rx="12" fill="#111722" stroke="#344052"/>
    <text x="978" y="434" fill="#84b4ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650">Backends</text>
    <text x="978" y="468" fill="#c6d0de" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">models · services</text>
    <text x="978" y="492" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">containers · pods</text>
  </g>

  <text x="56" y="568" fill="#596371" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Gateway owns protocol fidelity and local enforcement · A3S Cloud owns human operations and production orchestration</text>
</svg>
