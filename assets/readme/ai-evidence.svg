<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Token-aware A3S Gateway and NGINX benchmark evidence</title>
  <desc id="desc">A measurement sequence from request through first token, inter-token cadence, terminal marker, and completed-token goodput, followed by the fairness contract for eight profiles and five alternating trials.</desc>

  <rect x="1" y="1" width="1198" height="478" rx="26" fill="#ffffff" stroke="#d5e1f0" stroke-width="2"/>

  <text x="56" y="64" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="740" letter-spacing="-1.2">Measure the stream, not a request-rate proxy.</text>
  <text x="56" y="98" fill="#56657b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">The core lane decodes every token and rejects a trial if order, count, or the terminal marker is wrong.</text>
  <rect x="940" y="38" width="204" height="48" rx="10" fill="#eaf8f3"/>
  <circle cx="966" cy="62" r="6" fill="#0c8a65"/>
  <text x="984" y="69" fill="#0c6f52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="760">100% CORRECT</text>

  <g id="measurement-sequence" transform="translate(56 146)">
    <rect width="1088" height="168" rx="18" fill="#f6f8fc"/>
    <path d="M92 84h890" stroke="#c6d5e7" stroke-width="2"/>
    <path d="M92 84h205" stroke="#1264ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M297 84h685" stroke="#0c8a65" stroke-width="4" stroke-linecap="round"/>

    <circle cx="92" cy="84" r="11" fill="#1264ff"/>
    <circle cx="297" cy="84" r="13" fill="#ffffff" stroke="#1264ff" stroke-width="4"/>
    <circle cx="482" cy="84" r="9" fill="#0c8a65"/>
    <circle cx="594" cy="84" r="9" fill="#0c8a65"/>
    <circle cx="706" cy="84" r="9" fill="#0c8a65"/>
    <circle cx="818" cy="84" r="9" fill="#0c8a65"/>
    <rect x="969" y="71" width="26" height="26" rx="6" fill="#101827"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="740">
      <text x="92" y="42" text-anchor="middle" fill="#34445c" font-size="18">REQUEST</text>
      <text x="297" y="42" text-anchor="middle" fill="#1264ff" font-size="20">FIRST TOKEN</text>
      <text x="650" y="42" text-anchor="middle" fill="#0c8a65" font-size="20">TOKEN CADENCE</text>
      <text x="982" y="42" text-anchor="middle" fill="#101827" font-size="18">DONE</text>
      <text x="194" y="132" text-anchor="middle" fill="#1264ff" font-size="18">TTFT</text>
      <text x="650" y="132" text-anchor="middle" fill="#0c8a65" font-size="18">ITL · TPOT · E2E</text>
      <text x="982" y="132" text-anchor="middle" fill="#101827" font-size="18">GOODPUT</text>
    </g>
  </g>

  <g id="fairness-ledger" transform="translate(56 348)">
    <path d="M0 0h1088" stroke="#dce4f0"/>
    <path d="M272 18v82M544 18v82M816 18v82" stroke="#dce4f0"/>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <text x="0" y="46" fill="#101827" font-size="23" font-weight="730">8 workload profiles</text>
      <text x="0" y="76" fill="#56657b" font-size="16">C1 / C64 · 32 / 256 KiB</text>

      <text x="300" y="46" fill="#101827" font-size="23" font-weight="730">5 alternating trials</text>
      <text x="300" y="76" fill="#56657b" font-size="16">same host · alternating order</text>

      <text x="572" y="46" fill="#101827" font-size="23" font-weight="730">Feature-on A3S path</text>
      <text x="572" y="76" fill="#56657b" font-size="16">JSON bound + model validation</text>

      <text x="844" y="46" fill="#101827" font-size="23" font-weight="730">Auditable output</text>
      <text x="844" y="76" fill="#56657b" font-size="16">raw trials · version · host</text>
    </g>
  </g>
</svg>
