<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway</title>
  <desc id="desc">A3S Gateway is an AI Native Traffic Layer that validates ACL or Cloud snapshots, then routes model traffic locally to healthy backends.</desc>

  <rect width="1200" height="380" rx="24" fill="#07090d"/>
  <path d="M688 38V342" stroke="#252c37" stroke-width="1.5"/>

  <g id="identity" transform="translate(60 0)">
    <text y="54" fill="#54dda1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2.6">AI NATIVE TRAFFIC LAYER / RUST</text>
    <text y="132" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="760" letter-spacing="-2.5">A3S GATEWAY</text>
    <text y="184" fill="#c6d0de" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600">Route six protocols.</text>
    <text y="220" fill="#919baa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Enforce AI policy on the local data plane.</text>

    <g id="metadata" transform="translate(0 257)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <rect width="176" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="18" y="26" fill="#84b4ff">6 PROTOCOLS</text>
      <rect x="190" width="188" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="208" y="26" fill="#c6d0de">ATOMIC SNAPSHOT</text>
      <rect x="392" width="218" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="410" y="26" fill="#c6d0de">BOUNDED DRAIN</text>
    </g>

    <g id="boundary-note" transform="translate(0 334)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <circle cx="4" cy="-5" r="4" fill="#54dda1"/>
      <text x="18" y="0" fill="#748093">NO SYNCHRONOUS CONTROL-PLANE HOP</text>
    </g>
  </g>

  <g id="snapshot-proof" transform="translate(724 34)">
    <rect width="416" height="312" rx="16" fill="#0d1118" stroke="#343d4a" stroke-width="1.5"/>
    <path d="M0 48H416" stroke="#2a323e"/>
    <circle cx="24" cy="24" r="5" fill="#d9656c"/>
    <circle cx="42" cy="24" r="5" fill="#d7a857"/>
    <circle cx="60" cy="24" r="5" fill="#55bb83"/>
    <text x="392" y="30" text-anchor="end" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">gateway / active</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="24" y="82" fill="#748093" font-size="15">DESIRED STATE</text>
      <rect x="24" y="96" width="150" height="48" rx="8" fill="#111722" stroke="#344052"/>
      <text x="42" y="126" fill="#c6d0de" font-size="17">ACL / CLOUD</text>
      <path d="M186 120H222" stroke="#5794ff" stroke-width="2"/>
      <path d="M214 112L224 120 214 128" fill="none" stroke="#5794ff" stroke-width="2"/>
      <rect x="236" y="96" width="156" height="48" rx="8" fill="#102019" stroke="#2c8f67"/>
      <text x="254" y="126" fill="#72e2b0" font-size="17">VALIDATE ✓</text>

      <text x="24" y="178" fill="#748093" font-size="15">ACTIVE SNAPSHOT</text>
      <rect x="24" y="192" width="368" height="52" rx="8" fill="#101620" stroke="#5794ff"/>
      <text x="42" y="224" fill="#f4f7fb" font-size="18">rev 42</text>
      <text x="132" y="224" fill="#84b4ff" font-size="16">sha256:7c91…</text>
      <text x="368" y="224" text-anchor="end" fill="#54dda1" font-size="15">READY</text>

      <g id="request-path" transform="translate(24 278)" font-size="15">
        <text x="0" y="0" fill="#c6d0de">CLIENT</text>
        <path d="M58-5H92" stroke="#5794ff" stroke-width="2"/>
        <text x="102" y="0" fill="#c6d0de">ROUTE</text>
        <path d="M154-5H188" stroke="#5794ff" stroke-width="2"/>
        <text x="198" y="0" fill="#c6d0de">POLICY</text>
        <path d="M258-5H292" stroke="#5794ff" stroke-width="2"/>
        <text x="302" y="0" fill="#54dda1">STREAM</text>
      </g>
    </g>
  </g>
</svg>
