<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway — AI traffic measured and controlled locally</title>
  <desc id="desc">A project title beside an OpenAI-compatible token stream showing request admission, time to first token, inter-token cadence, and the terminal marker.</desc>

  <rect x="1" y="1" width="1198" height="428" rx="26" fill="#f8fbff" stroke="#d5e1f0" stroke-width="2"/>

  <g id="identity" transform="translate(56 48)">
    <g id="mark">
      <rect width="50" height="50" rx="13" fill="#1264ff"/>
      <path d="M11 14h17v22H11M28 25h8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="40" cy="25" r="5" fill="#ffffff" stroke="#9dc1ff" stroke-width="3"/>
    </g>
    <text x="68" y="22" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="760">A3S Gateway</text>
    <text x="68" y="45" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">OPENAI-COMPATIBLE · RUST · V1.1</text>

    <text x="0" y="126" fill="#101827" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.4">AI traffic,</text>
    <text x="0" y="191" fill="#1264ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.4">measured locally.</text>

    <text x="0" y="246" fill="#34445c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">Model policy, stream lifecycle, backend recovery,</text>
    <text x="0" y="278" fill="#34445c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">and atomic desired state in one Rust data plane.</text>

    <g id="local-path" transform="translate(0 330)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
      <text x="0" y="0" fill="#56657b">VALIDATE</text>
      <path d="M100-6h32" stroke="#9eb5d4" stroke-width="2"/>
      <text x="146" y="0" fill="#56657b">ADMIT</text>
      <path d="M214-6h32" stroke="#9eb5d4" stroke-width="2"/>
      <text x="260" y="0" fill="#56657b">ROUTE</text>
      <path d="M328-6h32" stroke="#9eb5d4" stroke-width="2"/>
      <text x="374" y="0" fill="#0c8a65">STREAM</text>
    </g>
  </g>

  <g id="token-signal" transform="translate(690 34)">
    <rect width="454" height="362" rx="20" fill="#ffffff" stroke="#b9cae0" stroke-width="1.5"/>
    <path d="M0 66h454" stroke="#dce4f0"/>
    <text x="24" y="30" fill="#1264ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="760">POST /v1/chat/completions</text>
    <text x="430" y="30" text-anchor="end" fill="#0c8a65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="760">200 · STREAM</text>
    <text x="24" y="53" fill="#7d899b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">snapshot rev 42 · model grant matched</text>

    <g id="timeline" transform="translate(28 112)">
      <path d="M0 76h394" stroke="#c3d2e5" stroke-width="2"/>
      <path d="M0 76h112" stroke="#1264ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M112 76h282" stroke="#0c8a65" stroke-width="4" stroke-linecap="round"/>

      <circle cx="0" cy="76" r="9" fill="#1264ff"/>
      <path d="M112 22v108" stroke="#1264ff" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="112" cy="76" r="11" fill="#ffffff" stroke="#1264ff" stroke-width="4"/>
      <circle cx="166" cy="76" r="8" fill="#0c8a65"/>
      <circle cx="214" cy="76" r="8" fill="#0c8a65"/>
      <circle cx="262" cy="76" r="8" fill="#0c8a65"/>
      <circle cx="310" cy="76" r="8" fill="#0c8a65"/>
      <rect x="377" y="67" width="18" height="18" rx="4" fill="#101827"/>

      <text x="0" y="8" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">REQUEST</text>
      <text x="112" y="8" text-anchor="middle" fill="#1264ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="760">TTFT</text>
      <text x="238" y="8" text-anchor="middle" fill="#0c8a65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="760">ITL / TPOT</text>
      <text x="394" y="8" text-anchor="end" fill="#101827" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">[DONE]</text>

      <path d="M166 112h48" stroke="#0c8a65" stroke-width="1.5"/>
      <path d="M166 106v12M214 106v12" stroke="#0c8a65" stroke-width="1.5"/>
      <text x="190" y="142" text-anchor="middle" fill="#56657b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">token cadence</text>
    </g>

    <g id="proof-ledger" transform="translate(24 286)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <path d="M0 0h406" stroke="#dce4f0"/>
      <text x="0" y="34" fill="#101827" font-size="21" font-weight="760">8 profiles</text>
      <text x="137" y="34" fill="#101827" font-size="21" font-weight="760">5× alternating</text>
      <text x="326" y="34" fill="#101827" font-size="21" font-weight="760">exact tokens</text>
      <text x="0" y="59" fill="#7d899b" font-size="15">same-host A3S / NGINX · raw trials published</text>
    </g>
  </g>
</svg>
