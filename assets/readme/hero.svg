<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway</title>
  <desc id="desc">A Rust gateway with local coding-agent CLI and Skill operations beside an AI traffic data plane.</desc>

  <rect width="1200" height="420" rx="24" fill="#07090d"/>
  <path d="M690 40V380" stroke="#252c37" stroke-width="1.5"/>

  <g id="identity" transform="translate(64 0)">
    <text y="62" fill="#54dda1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3">RUST / AGENT OPERATIONS + AI TRAFFIC</text>
    <text y="148" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">A3S GATEWAY</text>
    <text y="203" fill="#c6d0de" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="550">Run coding-agent CLIs and Skills.</text>
    <text y="239" fill="#919baa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Route and protect the AI traffic behind them.</text>

    <g id="metadata" transform="translate(0 278)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <rect width="132" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="18" y="26" fill="#84b4ff">ACL CONFIG</text>
      <rect x="146" width="168" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="164" y="26" fill="#c6d0de">NATIVE PROCESS</text>
      <rect x="328" width="194" height="40" rx="8" fill="#11151d" stroke="#323b48"/>
      <text x="346" y="26" fill="#c6d0de">STREAMING PLANE</text>
    </g>

    <g id="route-motif" transform="translate(0 366)">
      <circle cx="4" cy="0" r="4" fill="#54dda1"/>
      <path d="M8 0H252L278-22H456L476-2H548" fill="none" stroke="#5794ff" stroke-width="2"/>
      <path d="M540-10L550-2 540 6" fill="none" stroke="#5794ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="278" cy="-22" r="5" fill="#07090d" stroke="#54dda1" stroke-width="2"/>
    </g>
  </g>

  <g id="terminal" transform="translate(730 40)">
    <rect width="410" height="340" rx="16" fill="#0d1118" stroke="#343d4a" stroke-width="1.5"/>
    <path d="M0 48H410" stroke="#2a323e"/>
    <circle cx="24" cy="24" r="5" fill="#d9656c"/>
    <circle cx="42" cy="24" r="5" fill="#d7a857"/>
    <circle cx="60" cy="24" r="5" fill="#55bb83"/>
    <text x="386" y="30" text-anchor="end" fill="#748093" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">agent operations / local</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="24" y="86" fill="#54dda1" font-size="20">$</text>
      <text x="48" y="86" fill="#edf2fa" font-size="20">a3s-gateway agent list</text>
      <g font-size="19">
        <text x="24" y="132" fill="#84b4ff">a3s</text><text x="168" y="132" fill="#aab5c5">A3S Code</text><text x="352" y="132" fill="#54dda1">profile</text>
        <text x="24" y="172" fill="#84b4ff">claude</text><text x="168" y="172" fill="#aab5c5">Claude Code</text><text x="352" y="172" fill="#54dda1">profile</text>
        <text x="24" y="212" fill="#84b4ff">codex</text><text x="168" y="212" fill="#aab5c5">OpenAI Codex</text><text x="352" y="212" fill="#54dda1">profile</text>
        <text x="24" y="252" fill="#84b4ff">gemini</text><text x="168" y="252" fill="#aab5c5">Gemini CLI</text><text x="352" y="252" fill="#54dda1">profile</text>
        <text x="24" y="292" fill="#84b4ff">opencode</text><text x="168" y="292" fill="#aab5c5">OpenCode</text><text x="352" y="292" fill="#54dda1">profile</text>
      </g>
      <path d="M24 316H386" stroke="#28313c"/>
      <text x="24" y="337" fill="#919baa" font-size="16">SKILL.md</text>
      <path d="M124 331H170" stroke="#5794ff" stroke-width="2"/>
      <path d="M164 325L172 331 164 337" fill="none" stroke="#5794ff" stroke-width="2"/>
      <text x="188" y="337" fill="#c6d0de" font-size="16">selected native task</text>
    </g>
  </g>
</svg>
