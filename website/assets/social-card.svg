<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway</title>
  <desc id="desc">The AI gateway that understands the workload.</desc>
  <defs>
    <linearGradient id="paper" x1="92" y1="28" x2="1118" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1264ff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="627" rx="26.5" fill="none" stroke="#d8e2f1" stroke-width="3"/>

  <g transform="translate(76 66)">
    <image href="a3s-os-logo.png" width="64" height="64"/>
    <text x="84" y="29" fill="#0b1730" font-family="Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700">A3S Gateway</text>
    <text x="84" y="53" fill="#61708a" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1.5">MODEL-AWARE TRAFFIC CONTROL</text>
  </g>

  <text x="76" y="263" fill="#0b1730" font-family="Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="65" font-weight="720" letter-spacing="-3">The AI gateway that</text>
  <text x="76" y="339" fill="#1264ff" font-family="Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="65" font-weight="720" letter-spacing="-3">understands the workload.</text>
  <text x="80" y="397" fill="#61708a" font-family="Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">Model policy, bounded streams, health-aware recovery, atomic desired state.</text>

  <g transform="translate(76 478)" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="1">
    <rect width="202" height="54" rx="10" fill="#ffffff" stroke="#d8e2f1"/>
    <text x="20" y="33" fill="#1264ff">MODEL POLICY</text>
    <rect x="218" width="202" height="54" rx="10" fill="#ffffff" stroke="#d8e2f1"/>
    <text x="238" y="33" fill="#1264ff">STREAM BOUNDS</text>
    <rect x="436" width="222" height="54" rx="10" fill="#ffffff" stroke="#d8e2f1"/>
    <text x="456" y="33" fill="#1264ff">ATOMIC SNAPSHOTS</text>
  </g>

  <g transform="translate(920 455)">
    <rect width="196" height="98" rx="18" fill="#0b1730"/>
    <path d="M24 28h70v42H24M94 49h30" fill="none" stroke="#78a9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="144" cy="49" r="11" fill="#fff" stroke="#1264ff" stroke-width="4"/>
  </g>
