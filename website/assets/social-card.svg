    <circle cx="24" cy="28" r="5" fill="#54dda1"/>
    <text x="42" y="33" fill="#c6d0de">05 AGENT PROFILES</text>
    <rect x="224" width="202" height="56" rx="8" fill="#0d1118" stroke="#344052"/>
    <circle cx="248" cy="28" r="5" fill="#84b4ff"/>
    <text x="266" y="33" fill="#c6d0de">STANDARD SKILL.MD</text>
    <rect x="442" width="206" height="56" rx="8" fill="#0d1118" stroke="#344052"/>
    <circle cx="466" cy="28" r="5" fill="#8b6cff"/>
    <text x="484" y="33" fill="#c6d0de">06 PROTOCOLS</text>
  </g>

  <g transform="translate(949 465)">
    <path d="M0 38h70v-76H0M70 0h45" fill="none" stroke="#5794ff" stroke-opacity=".32" stroke-width="2"/>
