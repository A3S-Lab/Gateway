<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway live traffic topology</title>
  <desc id="desc">A model request enters A3S Gateway, is checked against the active policy snapshot, excludes an unhealthy backend, selects a healthy provider, and continues as a bounded stream.</desc>

  <defs>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#244c89" flood-opacity="0.11"/>
    </filter>
    <pattern id="topology-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1264ff" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#9eb5d4"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1264ff"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#f8fbff"/>
  <circle cx="1118" cy="-18" r="236" fill="none" stroke="#e1ecfb" stroke-width="50" opacity="0.74"/>

  <text x="52" y="59" fill="#101827" font-family="Geist Variable, Segoe UI, sans-serif" font-size="36" font-weight="720">Live route selection in one local graph</text>
  <text x="52" y="87" fill="#64748b" font-family="Geist Variable, Segoe UI, sans-serif" font-size="14">Policy narrows the graph. Runtime health decides the active edge.</text>
  <g transform="translate(1014 45)">
    <circle cx="0" cy="0" r="5" fill="#0c8a65"/>
    <text x="14" y="4" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="10" font-weight="760">LIVE TOPOLOGY</text>
  </g>

  <g id="base-snapshot" filter="url(#panel-shadow)">
    <rect x="52" y="110" width="1096" height="62" rx="13" fill="#ffffff" stroke="#c4d5ea"/>
    <rect x="70" y="126" width="31" height="31" rx="8" fill="#1264ff"/>
    <path d="M78 135h9v14h-9m9-7h6" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <circle cx="95" cy="142" r="2.5" fill="#ffffff"/>
    <text x="116" y="138" fill="#1264ff" font-family="Geist Mono Variable, Consolas, monospace" font-size="9" font-weight="760">ACTIVE SNAPSHOT</text>
    <text x="116" y="154" fill="#34445c" font-family="Geist Mono Variable, Consolas, monospace" font-size="11">revision 42 / listeners + routes + policy + health</text>
    <g transform="translate(806 126)" font-family="Geist Mono Variable, Consolas, monospace" font-size="9" font-weight="700">
      <rect width="98" height="31" rx="7" fill="#eef4ff"/>
      <text x="49" y="20" text-anchor="middle" fill="#084ed0">MODEL GRANT</text>
      <rect x="108" width="91" height="31" rx="7" fill="#eaf8f3"/>
      <text x="153.5" y="20" text-anchor="middle" fill="#0c8a65">2 HEALTHY</text>
      <rect x="209" width="105" height="31" rx="7" fill="#f4f7fb"/>
      <text x="261.5" y="20" text-anchor="middle" fill="#56657b">LEAST CONN</text>
    </g>
  </g>

  <g id="topology-base">
    <rect x="52" y="192" width="1096" height="376" rx="17" fill="#ffffff" stroke="#d3dfed"/>
    <rect x="53" y="193" width="1094" height="374" rx="16" fill="url(#topology-grid)"/>

    <g fill="none" stroke="#aabdd6" stroke-width="2" marker-end="url(#arrow-muted)">
      <path d="M270 371C338 371 365 365 430 365"/>
      <path d="M740 348C815 324 841 278 920 274"/>
      <path d="M740 365C815 365 844 368 920 368"/>
    </g>
    <path d="M740 382C818 407 844 458 920 462" fill="none" stroke="#d9a8b2" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow-muted)"/>

    <g filter="url(#panel-shadow)">
      <rect x="90" y="315" width="180" height="112" rx="14" fill="#ffffff" stroke="#cbd9eb"/>
      <circle cx="121" cy="346" r="13" fill="#eaf2ff"/>
      <path d="M115 342h12M115 347h8M115 352h10" fill="none" stroke="#1264ff" stroke-linecap="round" stroke-width="2"/>
      <text x="145" y="342" fill="#1264ff" font-family="Geist Mono Variable, Consolas, monospace" font-size="9" font-weight="760">REQUEST SOURCE</text>
      <text x="111" y="383" fill="#101827" font-family="Geist Variable, Segoe UI, sans-serif" font-size="18" font-weight="680">Model client</text>
      <text x="111" y="405" fill="#64748b" font-family="Geist Mono Variable, Consolas, monospace" font-size="10">POST /v1/chat</text>
    </g>

    <g filter="url(#panel-shadow)">
      <rect x="430" y="250" width="310" height="230" rx="17" fill="#ffffff" stroke="#a9c3e8"/>
      <rect x="430" y="250" width="310" height="54" rx="17" fill="#0e1b35"/>
      <path d="M430 287h310v17H430z" fill="#0e1b35"/>
      <rect x="450" y="265" width="26" height="26" rx="7" fill="#1264ff"/>
      <text x="463" y="283" text-anchor="middle" fill="#ffffff" font-family="Geist Variable, Segoe UI, sans-serif" font-size="13" font-weight="760">A</text>
      <text x="489" y="283" fill="#ffffff" font-family="Geist Variable, Segoe UI, sans-serif" font-size="16" font-weight="680">A3S Gateway</text>
      <circle cx="701" cy="277" r="5" fill="#42c79b"/>

      <g font-family="Geist Mono Variable, Consolas, monospace">
        <text x="456" y="333" fill="#7d899b" font-size="9" font-weight="740">LOCAL DECISION PATH</text>
        <rect x="456" y="349" width="258" height="34" rx="8" fill="#f4f7fb"/>
        <text x="471" y="371" fill="#34445c" font-size="10">route / identity / model grant</text>
        <rect x="456" y="392" width="124" height="46" rx="9" fill="#eef4ff" stroke="#c5d8f4"/>
        <text x="470" y="411" fill="#084ed0" font-size="8" font-weight="740">POLICY</text>
        <text x="470" y="427" fill="#34445c" font-size="10">admitted</text>
        <rect x="590" y="392" width="124" height="46" rx="9" fill="#eaf8f3" stroke="#b9dfd2"/>
        <text x="604" y="411" fill="#0c8a65" font-size="8" font-weight="740">RUNTIME</text>
        <text x="604" y="427" fill="#34445c" font-size="10">healthy target</text>
        <text x="456" y="461" fill="#7d899b" font-size="9">no synchronous Cloud lookup</text>
      </g>
    </g>

    <g font-family="Geist Variable, Segoe UI, sans-serif" filter="url(#panel-shadow)">
      <g>
        <rect x="920" y="235" width="190" height="78" rx="13" fill="#ffffff" stroke="#cedbec"/>
        <circle cx="946" cy="260" r="7" fill="#0c8a65"/>
        <text x="964" y="264" fill="#101827" font-size="15" font-weight="680">Provider A</text>
        <text x="942" y="291" fill="#64748b" font-family="Geist Mono Variable, Consolas, monospace" font-size="9">healthy / 18 active</text>
      </g>
      <g>
        <rect x="920" y="329" width="190" height="78" rx="13" fill="#ffffff" stroke="#9dbbe7"/>
        <circle cx="946" cy="354" r="7" fill="#0c8a65"/>
        <text x="964" y="358" fill="#101827" font-size="15" font-weight="680">Provider B</text>
        <text x="942" y="385" fill="#64748b" font-family="Geist Mono Variable, Consolas, monospace" font-size="9">healthy / 7 active</text>
      </g>
      <g opacity="0.72">
        <rect x="920" y="423" width="190" height="78" rx="13" fill="#fffafb" stroke="#e0b9c1"/>
        <circle cx="946" cy="448" r="7" fill="#b73d50"/>
        <text x="964" y="452" fill="#101827" font-size="15" font-weight="680">Provider C</text>
        <text x="942" y="479" fill="#a25a67" font-family="Geist Mono Variable, Consolas, monospace" font-size="9">circuit open / excluded</text>
      </g>
    </g>

    <g fill="#7d899b" font-family="Geist Mono Variable, Consolas, monospace" font-size="9" font-weight="720">
      <text x="100" y="222">ENTRY</text>
      <text x="444" y="222">POLICY + RUNTIME</text>
      <text x="928" y="222">CANDIDATE BACKENDS</text>
    </g>
  </g>

  <g id="request-packet">
    <circle cx="399" cy="365" r="13" fill="#1264ff"/>
    <circle cx="399" cy="365" r="20" fill="none" stroke="#1264ff" stroke-opacity="0.2" stroke-width="7"/>
    <text x="399" y="368" text-anchor="middle" fill="#ffffff" font-family="Geist Mono Variable, Consolas, monospace" font-size="7" font-weight="760">REQ</text>
  </g>

  <g id="policy-proof">
    <rect x="520" y="321" width="130" height="27" rx="7" fill="#eaf2ff" stroke="#b8cef0"/>
    <text x="585" y="339" text-anchor="middle" fill="#084ed0" font-family="Geist Mono Variable, Consolas, monospace" font-size="8" font-weight="760">POLICY MATCHED</text>
    <rect x="913" y="322" width="204" height="92" rx="16" fill="none" stroke="#1264ff" stroke-width="2"/>
    <rect x="1009" y="337" width="91" height="24" rx="6" fill="#1264ff"/>
    <text x="1054.5" y="353" text-anchor="middle" fill="#ffffff" font-family="Geist Mono Variable, Consolas, monospace" font-size="8" font-weight="760">SELECTED</text>
  </g>

  <g id="stream-output">
    <path d="M740 365C815 365 844 368 913 368" fill="none" stroke="#1264ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-active)"/>
    <circle cx="830" cy="368" r="7" fill="#ffffff" stroke="#1264ff" stroke-width="3"/>
    <rect x="770" y="397" width="121" height="26" rx="7" fill="#eaf8f3" stroke="#b6ddcf"/>
    <text x="830.5" y="414" text-anchor="middle" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="8" font-weight="760">BOUNDED STREAM</text>
  </g>

  <g id="topology-legend" font-family="Geist Mono Variable, Consolas, monospace" font-size="9">
    <circle cx="76" cy="593" r="5" fill="#1264ff"/>
    <text x="90" y="597" fill="#34445c">request admitted</text>
    <circle cx="257" cy="593" r="5" fill="#0c8a65"/>
    <text x="271" y="597" fill="#34445c">healthy edge selected</text>
    <circle cx="480" cy="593" r="5" fill="#b73d50"/>
    <text x="494" y="597" fill="#34445c">failed edge excluded</text>
    <text x="1124" y="597" text-anchor="end" fill="#7d899b">snapshot rev 42 / request keeps revision</text>
  </g>
</svg>
