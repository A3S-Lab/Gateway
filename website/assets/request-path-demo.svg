<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">A3S Gateway local request path</title>
  <desc id="desc">One validated snapshot applies route and model policy, selects a healthy backend, and relays a bounded streaming response without a synchronous Cloud lookup.</desc>

  <defs>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#244c89" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#f8fbff"/>
  <circle cx="1110" cy="-10" r="250" fill="none" stroke="#dce9fb" stroke-width="54" opacity="0.64"/>

  <text x="52" y="64" fill="#101827" font-family="Geist Variable, Segoe UI, sans-serif" font-size="38" font-weight="720">One request, one validated snapshot</text>
  <text x="52" y="91" fill="#64748b" font-family="Geist Variable, Segoe UI, sans-serif" font-size="14">Model policy and stream safety execute inside the local data plane.</text>

  <g id="base-snapshot" filter="url(#panel-shadow)">
    <rect x="52" y="116" width="1096" height="74" rx="14" fill="#ffffff" stroke="#bfd0e8"/>
    <rect x="70" y="134" width="40" height="38" rx="9" fill="#1264ff"/>
    <path d="M80 144h12v18H80m12-9h7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
    <circle cx="102" cy="153" r="3.5" fill="#ffffff"/>
    <text x="126" y="148" fill="#1264ff" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="720">ACTIVE SNAPSHOT</text>
    <text x="126" y="169" fill="#34445c" font-family="Geist Mono Variable, Consolas, monospace" font-size="14">gateway-01 / revision 42 / sha256:7c91...</text>
    <rect x="1014" y="135" width="112" height="36" rx="8" fill="#eaf8f3" stroke="#b7dfd1"/>
    <text x="1070" y="158" text-anchor="middle" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="740">READY</text>
  </g>

  <g id="pipeline-base">
    <path d="M296 340h42M566 340h42M836 340h42" fill="none" stroke="#9ebce8" stroke-width="2"/>
    <path d="M331 334l8 6-8 6M601 334l8 6-8 6M871 334l8 6-8 6" fill="none" stroke="#6f9add" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

    <rect x="52" y="226" width="244" height="228" rx="16" fill="#ffffff" stroke="#d4e0f0"/>
    <rect x="322" y="226" width="244" height="228" rx="16" fill="#ffffff" stroke="#d4e0f0"/>
    <rect x="592" y="226" width="244" height="228" rx="16" fill="#ffffff" stroke="#d4e0f0"/>
    <rect x="862" y="226" width="286" height="228" rx="16" fill="#ffffff" stroke="#d4e0f0"/>

    <g font-family="Geist Variable, Segoe UI, sans-serif">
      <text x="76" y="278" fill="#101827" font-size="22" font-weight="680">Entrypoint</text>
      <text x="346" y="278" fill="#101827" font-size="22" font-weight="680">Route and policy</text>
      <text x="616" y="278" fill="#101827" font-size="22" font-weight="680">Healthy target</text>
      <text x="886" y="278" fill="#101827" font-size="22" font-weight="680">Streaming relay</text>
    </g>

    <g fill="#7d899b" font-family="Geist Mono Variable, Consolas, monospace" font-size="11">
      <text x="76" y="306">HTTP / SSE / gRPC</text>
      <text x="346" y="306">grant / RPM / concurrency</text>
      <text x="616" y="306">health / circuit / weight</text>
      <text x="886" y="306">backpressure / bounded drain</text>
    </g>

    <g>
      <rect x="76" y="382" width="90" height="32" rx="7" fill="#eaf2ff"/>
      <text x="121" y="402" text-anchor="middle" fill="#084ed0" font-family="Geist Mono Variable, Consolas, monospace" font-size="10">HTTP/2</text>
      <rect x="346" y="382" width="94" height="32" rx="7" fill="#eaf2ff"/>
      <text x="393" y="402" text-anchor="middle" fill="#084ed0" font-family="Geist Mono Variable, Consolas, monospace" font-size="10">ACCEPTED</text>
      <rect x="616" y="382" width="104" height="32" rx="7" fill="#eaf8f3"/>
      <text x="668" y="402" text-anchor="middle" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="10">MODEL-V2</text>
      <rect x="886" y="382" width="122" height="32" rx="7" fill="#eaf8f3"/>
      <text x="947" y="402" text-anchor="middle" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="10">TEXT/EVENT-STREAM</text>
    </g>
  </g>

  <g id="request-packet">
    <rect x="76" y="326" width="196" height="42" rx="8" fill="#1264ff"/>
    <text x="91" y="351" fill="#ffffff" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="700">POST /v1/chat</text>
  </g>

  <g id="policy-proof">
    <rect x="346" y="326" width="196" height="42" rx="8" fill="#eef4ff" stroke="#aac6f1"/>
    <text x="361" y="351" fill="#084ed0" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="700">MODEL GRANT OK</text>
    <rect x="616" y="326" width="196" height="42" rx="8" fill="#eef4ff" stroke="#aac6f1"/>
    <text x="631" y="351" fill="#084ed0" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="700">HEALTHY / LEAST-CONN</text>
  </g>

  <g id="stream-output">
    <rect x="886" y="326" width="238" height="42" rx="8" fill="#eaf8f3" stroke="#9ed5c4"/>
    <text x="901" y="351" fill="#0c8a65" font-family="Geist Mono Variable, Consolas, monospace" font-size="11" font-weight="700">data: {"delta":"Hello"}</text>
  </g>

  <g id="terminal-proof" font-family="Geist Variable, Segoe UI, sans-serif">
    <rect x="52" y="486" width="1096" height="102" rx="16" fill="#0e1b35"/>
    <text x="76" y="521" fill="#80aaff" font-family="Geist Mono Variable, Consolas, monospace" font-size="10" font-weight="720">REQUEST GUARANTEES</text>

    <circle cx="82" cy="552" r="7" fill="#0c8a65"/>
    <path d="M79 552l2 2 4-5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    <text x="100" y="557" fill="#d9e7ff" font-size="13">No synchronous Cloud lookup</text>

    <circle cx="410" cy="552" r="7" fill="#0c8a65"/>
    <path d="M407 552l2 2 4-5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    <text x="428" y="557" fill="#d9e7ff" font-size="13">Fallback stops after response start</text>

    <circle cx="800" cy="552" r="7" fill="#0c8a65"/>
    <path d="M797 552l2 2 4-5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    <text x="818" y="557" fill="#d9e7ff" font-size="13">In-flight request keeps its snapshot</text>
  </g>
</svg>
