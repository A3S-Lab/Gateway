<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07090d">
    <title>Route not found — A3S Gateway</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; padding: 24px; background: #07090d; color: #f4f7fb; place-items: center; }
      main { width: min(100%, 620px); padding: clamp(32px, 8vw, 72px); border: 1px solid #344052; border-radius: 16px; background: #0d1118; }
      p:first-child { color: #84b4ff; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .12em; }
      h1 { margin: 22px 0 14px; font-size: clamp(42px, 10vw, 72px); letter-spacing: -.05em; }
      p { color: #919baa; line-height: 1.7; }
      a { display: inline-flex; margin-top: 18px; padding: 11px 16px; border: 1px solid #5794ff; border-radius: 8px; color: #f4f7fb; text-decoration: none; }
      a:focus-visible { outline: 2px solid #84b4ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>HTTP 404 / NO MATCHING ROUTE</p>
      <h1>Route not found.</h1>
      <p>The requested page is not part of this Gateway snapshot.</p>
      <a href="/Gateway/">Return to A3S Gateway</a>
    </main>
  </body>
</html>
