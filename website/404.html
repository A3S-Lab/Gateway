<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Route not found | A3S Gateway</title>
    <link rel="icon" href="/Gateway/assets/mark.svg" type="image/svg+xml">
    <style>
      @font-face { font-family: Geist; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/Gateway/assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); }
      :root { color-scheme: light; font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100vh; margin: 0; padding: 24px; background: #f5f7fb; color: #142033; place-items: center; }
      main { width: min(100%, 640px); padding: clamp(32px, 8vw, 64px); border: 1px solid #cbd4e0; border-radius: 12px; background: #fff; }
      img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 6px 16px rgba(36, 58, 154, .2); }
      .eyebrow { margin: 28px 0 0; color: #1456f0; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
      h1 { margin: 18px 0 14px; font-size: clamp(42px, 10vw, 70px); letter-spacing: -.055em; line-height: 1; }
      p { max-width: 460px; margin: 0; color: #526078; line-height: 1.7; }
      a { display: inline-flex; min-height: 44px; margin-top: 26px; padding: 0 18px; align-items: center; border-radius: 8px; background: #1456f0; color: #fff; font-weight: 700; text-decoration: none; }
      a:hover { background: #0f46c7; }
      a:focus-visible { outline: 3px solid rgba(20, 86, 240, .34); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/Gateway/assets/mark.svg" alt="">
      <p class="eyebrow">HTTP 404 / NO MATCHING ROUTE</p>
      <h1>Route not found.</h1>
      <p>The requested page is not part of this Gateway snapshot.</p>
      <a href="/Gateway/">Return to A3S Gateway</a>
    </main>
  </body>
</html>
