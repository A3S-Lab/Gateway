worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-upstream-tls.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    # Upstream speaks HTTPS with the private AI bench CA (copied to /tmp).
    upstream ai_benchmark_tls_backend {
        server 127.0.0.1:18100;
        keepalive 256;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass https://ai_benchmark_tls_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_trusted_certificate /tmp/a3s-ai-upstream-ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name 127.0.0.1;
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
