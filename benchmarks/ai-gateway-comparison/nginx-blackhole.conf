worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-blackhole.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    upstream ai_benchmark_backend {
        # TEST-NET-3 blackhole: SYN is dropped so dial waits for connect timeout.
        server 203.0.113.1:81;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
