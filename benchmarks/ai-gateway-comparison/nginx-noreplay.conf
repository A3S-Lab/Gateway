worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-noreplay.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    # Primary can reset mid-stream; backup must not be selected after body starts.
    # proxy_next_upstream only covers pre-response failures (fair dual-product).
    upstream ai_benchmark_backend {
        server 127.0.0.1:18100 max_fails=5 fail_timeout=10s;
        server 127.0.0.1:18110 backup;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
