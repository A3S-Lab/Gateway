worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-ratelimit.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    # Fair dual-product rate limit: ~5 r/s with burst 5 → mixed 200/429 under load.
    limit_req_zone $binary_remote_addr zone=ai_bench:1m rate=5r/s;
    limit_req_status 429;

    upstream ai_benchmark_backend {
        server 127.0.0.1:18100;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            limit_req zone=ai_bench burst=5 nodelay;
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
