worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-fallback.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    # Primary fails; backup serves after max_fails quarantine (fair dual-product).
    upstream ai_benchmark_backend {
        server 127.0.0.1:18199 max_fails=5 fail_timeout=10s;
        server 127.0.0.1:18100 backup;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:18102;

        location = /health {
            default_type text/plain;
            return 200 'ok\n';
        }

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
