worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-weighted.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    # weight 9:1 ~= 90%/10% stable:canary for dual-product fairness.
    upstream ai_benchmark_backend {
        server 127.0.0.1:18100 weight=9;
        server 127.0.0.1:18110 weight=1;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
