worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-tls.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    upstream ai_benchmark_backend {
        server 127.0.0.1:18100;
        keepalive 256;
    }

    # Downstream TLS termination (HTTP/1.1 + HTTP/2). Material is copied to
    # /tmp by scripts/run-ai-gateway-comparison.sh (same pattern as proxy-comparison).
    server {
        listen 127.0.0.1:18102 ssl http2;
        ssl_certificate     /tmp/a3s-ai-bench-cert.pem;
        ssl_certificate_key /tmp/a3s-ai-bench-key.pem;
        ssl_session_cache   shared:ai_bench_tls:10m;
        # Avoid measuring connection recycling instead of proxy stream cost.
        keepalive_requests 1000000;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
