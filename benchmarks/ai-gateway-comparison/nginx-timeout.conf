worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-timeout.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    client_body_buffer_size 512k;

    upstream ai_benchmark_backend {
        server 127.0.0.1:18100;
        keepalive 256;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            # Match Gateway stream_idle_timeout for fair idle-deadline smoke.
            proxy_read_timeout 2s;
        }
    }
}
