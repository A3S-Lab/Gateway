worker_processes auto;
pid /tmp/a3s-ai-benchmark-nginx-disk-spill.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    gzip off;
    client_max_body_size 8m;
    # Force client-body spill for the disk-spill lane: 32 KiB prompts exceed
    # this in-memory buffer. Volume path is created by the runner and recorded
    # under AI_BENCH_OUTPUT/disk-spill-volume.txt.
    client_body_buffer_size 16k;
    client_body_temp_path /tmp/a3s-ai-bench-client-body 1 2;

    upstream ai_benchmark_backend {
        server 127.0.0.1:18100;
        keepalive 256;
    }

    server {
        listen 127.0.0.1:18102;

        location / {
            proxy_pass http://ai_benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            # Request buffering stays on so NGINX can spill oversized bodies.
            proxy_request_buffering on;
            proxy_cache off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
