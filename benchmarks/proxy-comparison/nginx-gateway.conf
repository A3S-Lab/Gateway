load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes auto;
pid /tmp/a3s-benchmark-nginx.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream http_backend {
        server 127.0.0.1:18080;
        keepalive 128;
    }

    upstream websocket_backend {
        server 127.0.0.1:18093;
        keepalive 128;
    }

    upstream grpc_backend {
        server 127.0.0.1:18090;
    }

    server {
        listen 127.0.0.1:18082;

        location = /socket {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://http_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }

    server {
        listen 127.0.0.1:18444 ssl http2;
        ssl_certificate /tmp/a3s-benchmark-cert.pem;
        ssl_certificate_key /tmp/a3s-benchmark-key.pem;
        ssl_session_cache shared:benchmark:10m;

        location /grpc.echo {
            grpc_pass grpc://grpc_backend;
        }

        location / {
            proxy_pass http://http_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}

stream {
    upstream tcp_backend {
        server 127.0.0.1:18091;
    }

    upstream udp_backend {
        server 127.0.0.1:18092;
    }

    server {
        listen 127.0.0.1:19083;
        proxy_pass tcp_backend;
        proxy_timeout 30s;
    }

    server {
        listen 127.0.0.1:19084 udp;
        proxy_pass udp_backend;
        proxy_responses 1;
        proxy_timeout 30s;
    }
}
