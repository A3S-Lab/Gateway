worker_processes auto;
pid /tmp/a3s-benchmark-upstream.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:18080;

        location = /benchmark {
            default_type application/json;
            return 200 '{"status":"ok","source":"shared-upstream"}';
        }

        location = /events {
            default_type text/event-stream;
            add_header Cache-Control no-cache;
            return 200 'data: {"token":"one"}\n\ndata: {"token":"two"}\n\ndata: [DONE]\n\n';
        }

        location = /v1/chat/completions {
            default_type application/json;
            return 200 '{"id":"bench","object":"chat.completion","choices":[{"index":0,"message":{"role":"assistant","content":"pong"}}]}';
        }

        location = /v1/completions {
            default_type text/event-stream;
            add_header Cache-Control no-cache;
            return 200 'data: {"id":"bench","choices":[{"text":"pong"}]}\n\ndata: [DONE]\n\n';
        }
    }
}
