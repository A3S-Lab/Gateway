worker_processes auto;
pid /tmp/a3s-benchmark-upstream.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:18080;

        location / {
            default_type application/json;
            return 200 '{"status":"ok","source":"shared-upstream"}';
        }
    }
}
