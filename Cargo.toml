[package]
name = "a3s-gateway"
version = "1.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["A3S Lab"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Gateway"
description = "AI Native Traffic Layer with protocol routing and local policy enforcement"
readme = "README.md"
keywords = ["gateway", "api", "proxy", "routing", "load-balancer"]
categories = ["web-programming::http-server", "network-programming"]

[lib]
name = "a3s_gateway"
path = "src/lib.rs"

[[bin]]
name = "a3s-gateway"
path = "src/main.rs"

# Test-only loopback upstream for Managed Runtime Service real-process
# qualification (`tests/managed_runtime_real_process.rs`). Not a product binary.
[[bin]]
name = "managed-runtime-upstream"
path = "tests/fixtures/managed_runtime_upstream.rs"
doc = false

# Dual HTTP/1+HTTP/2 fixture for MRS gRPC real-process drain-wait.
[[bin]]
name = "managed-runtime-grpc-upstream"
path = "tests/fixtures/managed_runtime_grpc_upstream.rs"
doc = false

[dependencies]
arc-swap = "1"
# Async runtime — explicit features only; drops unused: process, parking_lot, stats, io-std, tracing
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
    "process",
    "signal",
] }

# HTTP
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
# Server-side only: drops client-legacy, service (confirmed unused via grep)
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "tls12",
    "webpki-roots",
] }
http = "1"
http-body-util = "0.1"
bytes = "1"
pin-project-lite = "0.2"

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
# Prefer rustls-pki-types PEM APIs; rustls-pemfile is unmaintained (RUSTSEC-2025-0134).

# WebSocket. rustls-tls-webpki-roots matches the HTTP proxy's public trust
# store. Private `tls_ca_file` services pass their own rustls config instead.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
a3s-acl = "=0.3.0"
sha2 = "0.10"
argon2 = "0.5"
url = "2"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client (for proxying + health checks)
# default-features = false drops native-tls; rustls-tls reuses the rustls already in the binary
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }

# ACME protocol (JWS signing + key generation)
ring = "0.17"
base64 = "0.22"

# File watching (hot reload)
notify = "8"

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
async-trait = "0.1"

# Durable local file locking
fs2 = "0.4"

# IP address parsing
ipnet = "2"

# JWT authentication
jsonwebtoken = "9"

# Compression
flate2 = "1"
brotli = "7"

# Redis (optional, for distributed rate limiting)
redis = { version = "0.30", features = ["tokio-comp"], optional = true }

# Kubernetes (optional, for K8s-native scaling)
# 2.0+ drops optional hyper-http-proxy → rustls-pemfile lock path (RUSTSEC-2025-0134).
kube = { version = "2.0", features = ["client", "runtime"], optional = true }
k8s-openapi = { version = "0.26", features = ["latest"], optional = true }

# Self-update
a3s-updater = "=0.3.0"

# Inline LLM/MCP wire firewall (agentfw-style): the detection + masking brain (optional)
a3s-sentry = { version = "=0.7.0", optional = true }

[features]
default = []
redis = ["dep:redis"]
kube = ["dep:kube", "dep:k8s-openapi"]
# Inline wire firewall: a local proxy that masks secrets + runs sentry's detectors on the LLM/MCP wire
wire = ["dep:a3s-sentry"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
# process drives real-binary integration fixtures; test-util provides
# tokio::time::pause() and #[tokio::test] helpers.
tokio = { version = "1", features = ["process", "test-util"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "middleware_pipeline"
harness = false

[[bench]]
name = "acl_parse"
harness = false

# ── Release profile ─────────────────────────────────────────────────────────
[profile.release]
# The shipped binary is latency-sensitive on small proxy responses.
opt-level = 3
# Fat LTO: the linker sees all crates at once → aggressive dead-code elimination
lto = "fat"
# Single codegen unit maximises inlining and dead-code removal across modules
codegen-units = 1
# Strip local symbols and debuginfo (keeps panic location strings)
strip = "symbols"
# Abort on panic: drops the entire stack-unwinding machinery (~hundreds of KB)
panic = "abort"
